name: macOS build

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: Device repository as owner/name
        required: true
        default: UniXNU/UniXNU-sheng
      device_ref:
        description: Device repository ref
        required: true
        default: main
      defconfig:
        description: Defconfig name (configs/ of the device repository)
        required: true
        default: sheng_defconfig
      steps:
        description: Steps to build (nothing is uploaded except text logs; userdata needs about 16 GB of disk)
        type: choice
        options:
          - kernel
          - kernel payload
          - kernel userdata
          - kernel userdata payload
        default: kernel
      xcode:
        description: Xcode version of the macos-26 image (/Applications/Xcode_<version>.app)
        required: true
        default: "26.6"
      runner:
        description: Hosted macOS runner (intel is the fallback when arm64 is queued)
        type: choice
        options:
          - macos-26
          - macos-26-intel
        default: macos-26
      ipsw_url:
        description: IPSW URL (empty uses board.toml)
        required: false
        default: ""
      data_seed_run_id:
        description: Successful Muyu Data seed workflow run ID (required for payload)
        required: false
        default: ""
      data_seed_packed_sha256:
        description: Expected SHA-256 of the decrypted Muyu packed Data seed (required for payload)
        required: false
        default: ""

permissions:
  contents: read
  actions: read

# One build per device configuration and ref. A dispatch for another device or defconfig runs next to it,
# and a running build is never cancelled by a later dispatch.
concurrency:
  group: macos-build-${{ github.ref }}-${{ inputs.device_repository }}-${{ inputs.device_ref }}-${{ inputs.defconfig }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  build:
    # Pinned to the macOS 26 image family: macos-latest moves between images (macos-15 had an Xcode
    # whose clang rejects the warning options the build passes with -Werror). The Intel image is the
    # same Xcode 26 line and avoids waiting indefinitely for an arm64 slot.
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer
      UNIXNU_DEVICE: ${{ github.workspace }}/device
      UNIXNU_IPSW: ${{ inputs.ipsw_url }}
      DEFCONFIG: ${{ inputs.defconfig }}
      STEPS: ${{ inputs.steps }}
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN || github.token }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check the inputs
        id: check
        env:
          HAS_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID != '' }}
          DATA_SEED_RUN_ID: ${{ inputs.data_seed_run_id }}
          DATA_SEED_PACKED_SHA256: ${{ inputs.data_seed_packed_sha256 }}
          HAS_PASSPHRASE: ${{ secrets.MUYU_DATA_SEED_PASSPHRASE != '' }}
        run: |
          python3 scripts/unixnu/test_boot_template.py
          fail() { echo "::error::$1"; exit 1; }
          [ -f device/board.toml ] || fail "the device repository has no board.toml"
          [ -f "device/configs/$DEFCONFIG" ] || fail "device/configs/$DEFCONFIG not found: $(cd device/configs 2>/dev/null && printf '%s ' *_defconfig)"
          [ -d "$DEVELOPER_DIR" ] || fail "Xcode not found at $DEVELOPER_DIR; installed: $(printf '%s ' /Applications/Xcode_*.app)"
          if [[ "$STEPS" == *payload* ]]; then
            [ -n "$UNIXNU_IPSW" ] || fail "payload builds need ipsw_url"
            [[ "$DATA_SEED_RUN_ID" =~ ^[1-9][0-9]*$ ]] || fail "payload builds need a numeric data_seed_run_id"
            [[ "$DATA_SEED_PACKED_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail "payload builds need a lowercase data_seed_packed_sha256"
            [ "$HAS_PASSPHRASE" = true ] || fail "payload builds need the MUYU_DATA_SEED_PASSPHRASE secret"
          fi
          if [[ "$STEPS" != *payload* ]] && { [ -n "$DATA_SEED_RUN_ID" ] || [ -n "$DATA_SEED_PACKED_SHA256" ]; }; then
            fail "Data seed inputs only apply to the payload step"
          fi
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          from unixnu.cli import parser, cmd_defconfig
          from unixnu.config import Context
          ctx = Context(parser().parse_args(['defconfig', os.environ['DEFCONFIG']]))
          cmd_defconfig(ctx)
          board = ctx.board
          name = board.get('board', {}).get('name')
          if not name:
              sys.exit('::error::board.toml needs [board] name')
          adt = board.get('payload', {}).get('adt', {})
          if 'payload' in os.environ['STEPS'] and adt.get('unique_chip_id') == 'required' and os.environ['HAS_CHIP_ID'] != 'true':
              sys.exit('::error::this board needs the platform seed for its payload: set the UNIXNU_UNIQUE_CHIP_ID secret')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'board={name}\n')
              out.write(f'work={ctx.work}\n')
          PY

      - name: Install host tools
        run: |
          # cmake and ninja come with the image. Homebrew LLVM is keg-only and stays off PATH: the driver finds it for
          # the archive builders, and everything else uses Xcode's clang. LLD is a separate formula since LLVM 23;
          # the payload step links the panic screen with ld.lld.
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Report the runner toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find mig
          clang --version | head -n 1
          "$(brew --prefix llvm)/bin/clang" --version | head -n 1
          python3 --version
          missing=0
          for tool in git make clang cmake ninja unifdef ld.lld mformat mcopy dtc xcodebuild openssl; do
            path=$(command -v "$tool" || true)
            printf '%-10s %s\n' "$tool" "${path:-MISSING}"
            [ -n "$path" ] || missing=1
          done
          df -h "$GITHUB_WORKSPACE"
          exit "$missing"

      - name: Prepare inputs
        if: contains(inputs.steps, 'payload')
        env:
          DATA_SEED_RUN_ID: ${{ inputs.data_seed_run_id }}
          EXPECTED_DATA_SEED_SHA256: ${{ inputs.data_seed_packed_sha256 }}
          PASSPHRASE: ${{ secrets.MUYU_DATA_SEED_PASSPHRASE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          umask 077
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions"
          artifact_name="muyu-data-seed-encrypted-${DATA_SEED_RUN_ID}"
          run_json="$RUNNER_TEMP/data-seed-run.json"
          artifacts_json="$RUNNER_TEMP/data-seed-artifacts.json"
          curl -fsSL --retry 3 --proto '=https' --tlsv1.2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$api/runs/$DATA_SEED_RUN_ID" -o "$run_json"
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg path '.github/workflows/muyu-data-seed.yml' \
            '.status == "completed" and .conclusion == "success" and
             .repository.full_name == $repo and .path == $path' \
            "$run_json" >/dev/null
          curl -fsSL --retry 3 --proto '=https' --tlsv1.2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$api/runs/$DATA_SEED_RUN_ID/artifacts?per_page=100" -o "$artifacts_json"
          artifact_id=$(jq -r --arg name "$artifact_name" \
            '.artifacts[] | select(.name == $name and (.expired | not)) | .id' \
            "$artifacts_json" | head -n 1)
          [ -n "$artifact_id" ] || {
            echo "::error::encrypted Data seed artifact $artifact_name is missing or expired"
            exit 1
          }
          seed_zip="$RUNNER_TEMP/muyu-data-seed.zip"
          seed_enc="$RUNNER_TEMP/muyu-data-seed.tar.gz.enc"
          seed_tar="$RUNNER_TEMP/muyu-data-seed.tar.gz"
          seed_dir="$RUNNER_TEMP/muyu-data-seed"
          curl -fsSL --retry 3 --proto '=https' --tlsv1.2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$api/artifacts/$artifact_id/zip" -o "$seed_zip"
          unzip -p "$seed_zip" muyu-data-seed.tar.gz.enc > "$seed_enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass env:PASSPHRASE -in "$seed_enc" -out "$seed_tar"
          mkdir -p "$seed_dir"
          tar -xzf "$seed_tar" -C "$seed_dir"
          seed="$seed_dir/muyu-data-200g.generated.dbr"
          printf '%s  %s\n' "$EXPECTED_DATA_SEED_SHA256" "$seed" | shasum -a 256 -c -
          mv "$seed" "$RUNNER_TEMP/data.dbr"

          trust_dir="$RUNNER_TEMP/trustcache-inputs"
          mkdir -p "$trust_dir"
          python3 - "$trust_dir" <<'PY'
          import os, plistlib, shutil, sys, tomllib, zipfile
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from unixnu.ipsw import RangeFile

          output = Path(sys.argv[1])
          profile = tomllib.loads(
              Path('profiles/os/ipados-27.0.1-24A446/profile.toml').read_text()
          )['ipsw']
          archive = zipfile.ZipFile(RangeFile(os.environ['UNIXNU_IPSW']))
          manifest = plistlib.loads(archive.read('BuildManifest.plist'))
          if ((manifest['ProductVersion'], manifest['ProductBuildVersion']) !=
                  (profile['version'], profile['build'])):
              raise SystemExit('the IPSW version/build does not match the profile')
          identity = next(item for item in manifest['BuildIdentities']
                          if item['Info']['DeviceClass'] == profile['device_class']
                          and item['Info']['RestoreBehavior'] == 'Erase'
                          and int(item['ApChipID'], 16) == profile['chip_id']
                          and int(item['ApBoardID'], 16) == profile['board_id'])
          for component, name in (
                  ('StaticTrustCache', 'static.trustcache'),
                  ('Cryptex1,SystemTrustCache', 'system.trustcache')):
              member = identity['Manifest'][component]['Info']['Path']
              with archive.open(member) as source, (output / name).open('wb') as target:
                  shutil.copyfileobj(source, target, 8 << 20)
          print(*(path.name for path in sorted(output.iterdir())), sep='\n')
          PY
          python3 scripts/bundle-ipsw-trust.py \
            "$RUNNER_TEMP/trustcache" \
            "$trust_dir/static.trustcache" "$trust_dir/system.trustcache"
          printf '%s  %s\n' \
            dc655bcb2ddfaea214f9ec83659b3fc8d8b658bafac2b5a004fb4179a25c89bf \
            "$RUNNER_TEMP/trustcache" | shasum -a 256 -c -

      - name: Build kernel
        id: kernel
        env:
          # prepare-xnu-source.py lists Apple sources through the GitHub API; anonymous calls from hosted runners hit
          # the shared rate limit (HTTP 403).
          GITHUB_TOKEN: ${{ github.token }}
          # The device repository ships only the signed 544-byte policy headers;
          # the full block tables are generated with the userdata image.
          XNU_SOURCE_STORAGE_TABLES: userdata
        run: ./unixnu build kernel

      - name: Build userdata
        id: userdata
        if: contains(inputs.steps, 'userdata')
        run: |
          ./unixnu build userdata
          df -h "$GITHUB_WORKSPACE"

      - name: Build payload
        id: payload
        if: contains(inputs.steps, 'payload')
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          ./unixnu build payload \
            --trust-cache "$RUNNER_TEMP/trustcache" \
            --data-ramdisk "$RUNNER_TEMP/data.dbr"

      - name: Collect the text logs
        id: logs
        if: always() && steps.check.outcome == 'success'
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          BOARD: ${{ steps.check.outputs.board }}
          WORK: ${{ steps.check.outputs.work }}
        run: |
          # Only *.log files are copied, with secrets and tokenized URLs redacted. Kernels, payloads, disk images,
          # kernelcaches and IPSW members are never uploaded: they derive from Apple software.
          python3 - <<'PY'
          import os, re, shutil
          from pathlib import Path
          source = Path(os.environ['WORK']) / 'logs'
          target = Path(os.environ['RUNNER_TEMP']) / 'public-logs'
          shutil.rmtree(target, ignore_errors=True)
          target.mkdir(parents=True)
          secrets = [os.environ.get('UNIXNU_UNIQUE_CHIP_ID', '')]
          secrets = [value for value in secrets if value]
          count = 0
          for path in sorted(source.glob('*.log')) if source.is_dir() else []:
              data = path.read_bytes()
              if b'\0' in data:
                  continue
              text = data.decode('utf-8', 'replace')
              for value in secrets:
                  text = text.replace(value, '***')
              text = re.sub(r'https?://[^\s"\']*[?&](?:token|sig|signature|key|X-Amz-Signature)=[^\s"\']*', '***', text, flags=re.I)
              (target / path.name).write_text(text)
              count += 1
          print(f'{count} text logs staged')
          PY

      - name: Upload the build logs
        if: always() && steps.logs.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unixnu-${{ steps.check.outputs.board }}-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-logs/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        if: always()
        env:
          BOARD: ${{ steps.check.outputs.board }}
          KERNEL: ${{ steps.kernel.outcome }}
          USERDATA: ${{ steps.userdata.outcome }}
          PAYLOAD: ${{ steps.payload.outcome }}
        run: |
          {
            echo "## macOS build: ${BOARD:-unknown} (${DEFCONFIG}, ${STEPS})"
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| kernel | ${KERNEL:-skipped} |"
            echo "| userdata | ${USERDATA:-skipped} |"
            echo "| payload | ${PAYLOAD:-skipped} |"
            echo
            echo "This workflow only checks that the build works. It publishes text logs (7 days) and no images."
            xcodebuild -version | head -n 1
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove proprietary inputs
        if: always()
        run: |
          rm -rf out/ipsw out/feeds device/.cache/firmware out/*/tree/.cache/firmware out/*/payload/data-skip-setup-* out/*/*/*/tree/.cache/firmware out/*/*/*/payload/data-skip-setup-*
          rm -rf "$RUNNER_TEMP/muyu-data-seed" "$RUNNER_TEMP/trustcache-inputs"
          rm -f "$RUNNER_TEMP/trustcache" "$RUNNER_TEMP/data.dbr" \
            "$RUNNER_TEMP/muyu-data-seed.zip" "$RUNNER_TEMP/muyu-data-seed.tar.gz" \
            "$RUNNER_TEMP/muyu-data-seed.tar.gz.enc" \
            "$RUNNER_TEMP/data-seed-run.json" "$RUNNER_TEMP/data-seed-artifacts.json"
